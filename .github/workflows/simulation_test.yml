name: Simulation Test

on:
  pull_request:
    branches: [ main ]

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      notebook-matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - name: List all notebooks
        id: set-matrix
        run: |
          python -c "
          import sys
          sys.path.append('tests/simulation_test')
          from config import NOTEBOOKS_TO_TEST
          import json
          print(json.dumps(NOTEBOOKS_TO_TEST))
          " > notebooks.json
          echo "matrix=$(cat notebooks.json)" >> $GITHUB_OUTPUT

  test-notebooks:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{fromJSON(needs.generate-matrix.outputs.notebook-matrix)}}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pypulseq==1.4.2post1 &> /dev/null
          pip install torchkbnufft
          pip install nbformat

      - name: Generate sequence file
        run: |
          mkdir tests/simulation_test/seq_files
          python tests/simulation_test/generate_seq_files.py ${{ matrix.notebook }}

      - name: Cloning main branch
        run: |
          git clone https://github.com/MRsources/MRzero-Core.git main_branch
          mkdir tests/simulation_test/ref_files

      - name: Installing main branch version
        run: |
          pip install -e ./main_branch

      - name: Generate reference files
        run: |
          python tests/simulation_test/generate_ref_files.py
      
      - name: Uninstall main branch version and install current version
        run: |
          pip uninstall -y MRzeroCore
          pip install -e .

      - name: Generate actual files
        run: |
          mkdir tests/simulation_test/actual_files
          python tests/simulation_test/generate_actual_files.py

      - name: Run Simulation Test
        run: |
          python tests/simulation_test/test_simulation.py

      - name: Plot comparison
        if: always()
        id: plot
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: |
          python tests/simulation_test/plot_comparison.py "$NOTEBOOK" sim_report
          echo "name=$(basename "$NOTEBOOK" .ipynb)" >> $GITHUB_OUTPUT

      - name: Upload comparison plot
        if: always() && steps.plot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-${{ steps.plot.outputs.name }}
          path: sim_report/

      - name: Upload raw simulation data
        if: always() && steps.plot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sim-data-${{ steps.plot.outputs.name }}
          path: |
            tests/simulation_test/ref_files/
            tests/simulation_test/actual_files/
            tests/simulation_test/seq_files/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: test-notebooks
    # PRs from forks get a read-only token, they only get the artifacts
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push images to the sim-test-images branch
      pull-requests: write   # post the comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sim-report-*
          path: sim_report
          merge-multiple: true

      - name: Push images to sim-test-images branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: pr-${{ github.event.pull_request.number }}/run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          REPORT="$PWD/sim_report"
          cd "$(mktemp -d)"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin sim-test-images; then
            git checkout -q -b sim-test-images FETCH_HEAD
          else
            git checkout -q --orphan sim-test-images
          fi
          mkdir -p "$DEST"
          cp "$REPORT"/*.png "$DEST"/ 2>/dev/null || true
          git add -A
          git commit -q --allow-empty -m "Simulation test images for $DEST"
          # Retry in case another PR pushed concurrently
          for i in 1 2 3; do
            git push -q origin sim-test-images && break
            git pull -q --rebase origin sim-test-images
          done
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT

      - name: Build report
        run: |
          python tests/simulation_test/build_report.py sim_report \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.push.outputs.sha }}/${{ steps.push.outputs.dest }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > comment.md

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('comment.md', 'utf8');
            const marker = '<!-- simulation-test-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }